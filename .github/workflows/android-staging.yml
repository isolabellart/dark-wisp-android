name: Android staging build

on:
  push:
    branches:
      - feature/deepl-translation
      - integration/deepl-plus-blossom
      - feat/repost-undo-feed-scroll
      - feat/feed-redesign-navigation
      - feature/nip99-marketplace-integrated-fixes
      - fix/marketplace-stability-zoom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean previous build outputs
        run: ./gradlew --no-daemon --no-build-cache --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" clean

      - name: Run unit tests and build staging APK with stacktrace
        run: ./gradlew --no-daemon --no-build-cache --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" testStagingUnitTest assembleStaging --stacktrace --info

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: dark-wisp-marketplace-integrated-staging
          path: app/build/outputs/apk/staging/*.apk
          if-no-files-found: error

# Combined verification build for DeepL, Blossom and the integrated Marketplace.
# Keep the staging verification traceable for the revised feed navigation.
