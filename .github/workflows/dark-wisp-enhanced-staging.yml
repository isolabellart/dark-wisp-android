name: Dark Wisp Enhanced staging validation

on:
  push:
    branches:
      - "release/dark-wisp-enhanced"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run staging unit tests
        run: |
          ./gradlew --no-daemon --no-build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            testStagingUnitTest --stacktrace

      - name: Build staging APK
        run: |
          ./gradlew --no-daemon --no-build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            assembleStaging --stacktrace

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: dark-wisp-enhanced-staging-1.0.2
          path: app/build/outputs/apk/staging/*.apk
          if-no-files-found: error
          retention-days: 90
