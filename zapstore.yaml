repository: https://github.com/isolabellart/postilla-android
release_filter: '^v[0-9]+\.[0-9]+\.[0-9]+$'
match: '(?i)^Postilla-v[0-9]+\.[0-9]+\.[0-9]+\.apk$'

name: Postilla
summary: An independent Android Nostr client for social conversations, private messaging, Lightning and a NIP-99 marketplace.
description: |
  Postilla is an independent, open-source Android Nostr client designed as a calm, editorial space for conversations, discovery and exchange.

  It brings together Nostr social feeds, NIP-17 private messaging, DeepL translation, a Lightning wallet and a NIP-99 marketplace for products and services.

  Postilla continues the work of the original Dark Wisp Android project as an independently maintained downstream fork. The Android application ID remains com.isolabellart.darkwispenhanced and keeps its existing signing identity so current installations can receive future Postilla updates. Postilla is not an official upstream Dark Wisp release.

  The planned Postilla v1.0.15 release will replace the previous Dark Wisp Enhanced v1.0.10 release in the same Android installation line. This version is a release target, not a claim that v1.0.15 has already been published.
