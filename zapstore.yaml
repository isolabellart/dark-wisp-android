repository: https://github.com/isolabellart/dark-wisp-android
release_filter: '^v[0-9]+\.[0-9]+\.[0-9]+$'
match: '(?i)^Dark-Wisp-Enhanced-v[0-9]+\.[0-9]+\.[0-9]+\.apk$'

name: Dark Wisp Enhanced
summary: An independent Android Nostr client with translation, a NIP-99 marketplace, and Lightning wallet access.
description: |
  Dark Wisp Enhanced is an independent Android Nostr client built on the foundations of the original Dark Wisp project.

  It adds a customizable left/right navigation drawer, online-user and connected-relay indicators, integrated DeepL translation, improvements to the Conversations feed, a NIP-99 marketplace with private seller contact, and convenient access to the integrated Lightning wallet.

  Dark Wisp Enhanced is a separate application with its own Android package ID. It is an independent downstream project, not an official release of the upstream Dark Wisp project.
license: MIT
website: https://github.com/isolabellart/dark-wisp-android/releases/latest
